name: Build

# Builds the Apogee Engine from the private source repo (checked out with a read-only deploy key) on this public
# repo's free runners: the SDK (mods and maps, no game exports), the editor and the export templates, for Linux,
# Windows and macOS. Run it by hand with an engine ref; give a tag to publish the binaries as a release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Engine branch, tag or commit
        default: main
      platforms:
        description: "Platforms to build, a JSON list (a subset of linuxbsd, windows, macos)"
        default: '["linuxbsd", "windows", "macos"]'
      tag:
        description: "Release tag to publish (empty: build only, keep the artifacts for 14 days)"
        default: ""

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache
  SCONS_CACHE_LIMIT: "4096"

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.name }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-2022' || matrix.platform == 'macos' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
        name: [sdk, editor, template_release, template_debug]
        include:
          - { name: sdk, task: "editor --sdk" }
          - { name: editor, task: editor }
          - { name: template_release, task: "templates --templates release" }
          - { name: template_debug, task: "templates --templates debug" }
    env:
      ARCH: ${{ matrix.platform == 'macos' && 'universal' || 'x86_64' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Engine source
        uses: actions/checkout@v4
        with:
          repository: apogeeengine/Apogee.Engine
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SCons
        run: python -m pip install scons

      - name: Linux packages
        if: matrix.platform == 'linuxbsd'
        run: sudo apt-get update && sudo apt-get install -y libwayland-bin lld

      - name: Direct3D 12 SDKs
        if: matrix.platform == 'windows'
        working-directory: engine
        run: python Tools/Scripts/install_d3d12_sdk_windows.py

      - name: Vulkan SDK (MoltenVK)
        if: matrix.platform == 'macos'
        working-directory: engine
        run: Tools/Scripts/install_vulkan_sdk_macos.sh

      - name: SCons cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-${{ matrix.platform }}-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: scons-${{ matrix.platform }}-${{ matrix.name }}-

      - name: Build
        working-directory: engine
        env:
          GODOT_SCRIPT_ENCRYPTION_KEY: ${{ secrets.GODOT_SCRIPT_ENCRYPTION_KEY }}
        run: ./build.sh ${{ matrix.task }} --profile release --platform ${{ matrix.platform }} --arch ${{ env.ARCH }}

      # Saved even when the build fails, so a rerun starts from the objects already built.
      - name: Save the SCons cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-${{ matrix.platform }}-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}

      # The binaries and the libraries they need beside them (OpenAL Soft, steam_api): compiled only, never Valve's
      # headers or import libraries.
      - name: Package
        run: |
          mkdir out
          cd engine/Bin
          shopt -s nullglob
          files=(apogee.*.${{ env.ARCH }}* *.so* *.dll *.dylib)
          cp -a "${files[@]}" ../../out/
          cd ../..
          cp engine/Source/ThirdParty/openal-soft/COPYING-openal-soft.txt out/ # OpenAL Soft is LGPL: its text ships with it.
          rm -f out/*.lib out/*.exp
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: apogee-${{ matrix.platform }}-${{ matrix.name }}-${{ env.ARCH }}
          path: out
          retention-days: 14

  release:
    name: Release ${{ inputs.tag }}
    if: inputs.tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Engine files for the templates
        uses: actions/checkout@v4
        with:
          repository: apogeeengine/Apogee.Engine
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine
          sparse-checkout: |
            Tools/Dist/macos_template.app
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # What the editor's export looks for in <templates>/4.7.2.stable/, under Godot's names, with the libraries an
      # export copies beside the game. Install it by unzipping into that folder (or Editor > Manage Export Templates).
      - name: Export templates
        run: |
          a=artifacts
          t=templates; mkdir -p $t
          for target in release debug; do
            cp $a/apogee-linuxbsd-template_$target-x86_64/apogee.linuxbsd.template_$target.x86_64 $t/linux_$target.x86_64
            w=$a/apogee-windows-template_$target-x86_64
            cp $w/apogee.windows.template_$target.x86_64.exe $t/windows_${target}_x86_64.exe
            cp $w/apogee.windows.template_$target.x86_64.console.exe $t/windows_${target}_x86_64_console.exe
          done
          cp -n $a/apogee-linuxbsd-template_release-x86_64/*.so* $a/apogee-linuxbsd-template_release-x86_64/COPYING-openal-soft.txt $t/
          cp -n $a/apogee-windows-template_release-x86_64/*.dll $t/
          cp -n $a/apogee-macos-template_release-universal/*.dylib $t/
          app=macos_template.app
          cp -R engine/Tools/Dist/$app $app
          mkdir -p $app/Contents/MacOS
          for target in release debug; do
            cp $a/apogee-macos-template_$target-universal/apogee.macos.template_$target.universal $app/Contents/MacOS/godot_macos_$target.universal
            chmod +x $app/Contents/MacOS/godot_macos_$target.universal
          done
          zip -qry $t/macos.zip $app
          echo "4.7.2.stable" > $t/version.txt
          mkdir -p dist
          zip -qr dist/apogee-export-templates.tpz $t
          ls -l $t

      - name: Zip each artifact
        run: |
          mkdir -p dist
          for d in artifacts/*/; do
            n="$(basename "$d")"
            (cd "$d" && zip -qr "../../dist/$n.zip" .)
          done
          cd dist && sha256sum *.zip *.tpz > SHA256SUMS && ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Apogee Engine ${{ inputs.tag }}" \
            --notes "Built from apogeeengine/Apogee.Engine @ ${{ inputs.ref }}. The SDK packs mods and maps; the editor and templates are for building games."
